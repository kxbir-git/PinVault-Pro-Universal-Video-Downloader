
services:
  # ──────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pinvault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pinvaultpro}
      POSTGRES_USER: ${POSTGRES_USER:-pinvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-api/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinvault}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pinvault_net

  # ──────────────────────────────────────
  # Redis Cache & Queue
  # ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pinvault_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pinvault_net

  # ──────────────────────────────────────
  # Express.js API Gateway
  # ──────────────────────────────────────
  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: pinvault_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-pinvault}:${POSTGRES_PASSWORD:-securepassword}@postgres:5432/${POSTGRES_DB:-pinvaultpro}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      PYTHON_SERVICE_URL: http://python-service:8000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-api:/app
      - /app/node_modules
    networks:
      - pinvault_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────
  # Python FastAPI Microservice
  # ──────────────────────────────────────
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: pinvault_python
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./python-service:/app
      - tmp_downloads:/tmp/downloads
    networks:
      - pinvault_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────
  # Next.js Frontend
  # ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pinvault_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - pinvault_net

  # ──────────────────────────────────────
  # Nginx Reverse Proxy
  # ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pinvault_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend-api
    networks:
      - pinvault_net

volumes:
  postgres_data:
  redis_data:
  tmp_downloads:

networks:
  pinvault_net:
    driver: bridge
